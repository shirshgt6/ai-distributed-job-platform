version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: jq_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: jq_redis
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3.7
    container_name: jq_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      # Two listeners now: INTERNAL for other containers on this same
      # Docker network (they reach Kafka via the service name "kafka"),
      # EXTERNAL for anything connecting from the host machine (localhost).
      - KAFKA_CFG_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: jq_api
    ports:
      - "4000:4000"
    environment:
      # Service names, NOT localhost — Docker's internal DNS resolves
      # "mongo", "redis", "kafka" to the right containers on this network.
      - MONGO_URI=mongodb://mongo:27017/job_queue_system
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKER=kafka:29092
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-dev-access-secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret}
      - PORT=4000
    depends_on:
      - mongo
      - redis
      - kafka
    command: ["node", "src/server.js"]

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: jq_worker
    environment:
      - MONGO_URI=mongodb://mongo:27017/job_queue_system
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKER=kafka:29092
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-dev-access-secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      # Only the worker calls the LLM, so only the worker gets the key —
      # the API container never needs it (least privilege).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_MODELS=${AI_MODELS:-claude-sonnet-5,claude-haiku-4-5-20251001}
      - AI_REQUEST_TIMEOUT_MS=${AI_REQUEST_TIMEOUT_MS:-25000}
    depends_on:
      - mongo
      - redis
      - kafka
    # Overrides the Dockerfile's default CMD — same image, different
    # entry point. This is exactly why we didn't need two Dockerfiles.
    command: ["node", "src/worker/worker.js"]

volumes:
  mongo_data:
  kafka_data:
